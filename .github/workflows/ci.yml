name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test tools and media dependencies
        # Exercise wheel packaging and real media edits without downloading ASR models.
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install pytest ruff build setuptools wheel yt-dlp

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests
        run: pytest -q
